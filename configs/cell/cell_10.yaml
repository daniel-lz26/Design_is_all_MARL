# cell_10: the abstract_10 orders (routes, release and process times) in the cell, 4 robots.
# Deterministic: no noise, no disruptions. Orders are read from abstract_10.yaml (source of
# truth; its release and process times are PLACEHOLDER). Due dates are recalibrated for the
# cell: due = release + due_k x minimum flow time; due_k = 1.50 puts the best family-A rule at
# 50% on time (k = 1.48 gives 40%). See docs/env_v1_notes.md. cell_10_raw keeps the old dues.
name: cell_10
layout: configs/cell_layouts/sac_6x4.yaml
n_robots: 4
orders_from: configs/scenarios/abstract_10.yaml
due_k: 1.50
machine_seq_rule: FIFO
